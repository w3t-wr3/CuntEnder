[package]
name = "cntndr"
version = "0.1.0"
description = "CNTNDR 1v1 wagering escrow"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "cntndr"

[features]
default = ["init-if-needed"]
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
init-if-needed = ["anchor-lang/init-if-needed"]

[dependencies]
anchor-lang = "0.30.1"
anchor-spl = "0.30.1"
